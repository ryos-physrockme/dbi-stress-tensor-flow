# trigger
name: One-shot referee revision finisher

on:
  push:
    branches: [pre-arxiv-referee-revision]
    paths:
      - .github/workflows/referee-finish.yml

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pre-arxiv-referee-revision

      - name: Apply final referee-response edits
        shell: python
        run: |
          from pathlib import Path
          p = Path('paper/paper.tex')
          s = p.read_text(encoding='utf-8')
          old = '''We first assume $r\\neq0$ and $\\Delta\\neq0$ so that both $h_{\\mu\\nu}$ and the DBI matrix are invertible. On the nonsingular real branch connected continuously to $\\lambda=0$ within this parametrization, $r>0$: it starts at $r=1$ and cannot change sign without passing through the singular point $r=0$ of $h_{\\mu\\nu}$. The factorization obtained below can be rewritten as a polynomial identity in the original DBI variables and may then be continued algebraically to limiting loci where that identity remains defined. Such a polynomial continuation should not be confused with treating $r=0$ as part of the physical $h$-invertible branch. Introduce'''
          new = '''We first assume $r\\neq0$ and $\\Delta\\neq0$ so that both $h_{\\mu\\nu}$ and the DBI matrix are invertible. For $\\lambda>0$, the nonsingular real branch has $r>0$. To see this without relying only on continuity, suppose $r<0$. Then $v_\\mu$ is timelike and the rank-one update $h_{\\mu\\nu}=g_{\\mu\\nu}+\\lambda v_\\mu v_\\nu$ is positive definite. An $h$-antisymmetric real matrix $J$ then has purely imaginary eigenvalues in conjugate pairs, so $\\det(\\Id+J)>0$. Equation~\\eqref{eq:Delta-J-app} would therefore give $\\Delta^2=r\\det(\\Id+J)<0$, contradicting the real DBI branch. Thus $r<0$ is excluded. The factorization obtained below can be rewritten as a polynomial identity in the original DBI variables and may then be continued algebraically to limiting loci where that identity remains defined. Such a polynomial continuation should not be confused with treating $r=0$ as part of the physical $h$-invertible branch. Introduce'''
          if old not in s: raise SystemExit('English r-domain paragraph not found')
          s=s.replace(old,new,1)
          old='''Ferko et al.~\\cite{Ferko2024DBI} use $x_1=X/2$ and show that their stress-tensor operator for the scalar sector reduces to
\\begin{equation}
 \\frac{\\partial\\Lag}{\\partial\\lambda}
 =-\\frac12\\Lag^2+\\Lag x_1\\frac{\\partial\\Lag}{\\partial x_1}.
 \\label{eq:ferko-scalar-flow}
\\end{equation}
For eq.~\\eqref{eq:pure-scalar-L}, $\\partial\\Lag/\\partial x_1=-1/\\Delta_\\phi$, and the right-hand side of eq.~\\eqref{eq:ferko-scalar-flow} is exactly eq.~\\eqref{eq:pure-scalar-Q}.'''
          new='''Ferko et al.~\\cite{Ferko2024DBI} use $x_1=X/2$. In $d=4$ their scalar stress-tensor operator is
\\begin{equation}
 \\mathcal O^{(4)}
 =\\frac18T_{\\mu\\nu}T^{\\mu\\nu}-\\frac1{16}(\\tr T)^2
 +\\frac18(\\tr T)R,
 \\qquad
 R=\\sqrt{\\frac13\\left[T_{\\mu\\nu}T^{\\mu\\nu}-\\frac14(\\tr T)^2\\right]},
 \\label{eq:ferko-scalar-operator}
\\end{equation}
with the root chosen so that on their timelike scalar branch $R=x_1\\,\\partial\\Lag/\\partial x_1$. On the scalar ansatz this operator reduces to
\\begin{equation}
 \\frac{\\partial\\Lag}{\\partial\\lambda}
 =-\\frac12\\Lag^2+\\Lag x_1\\frac{\\partial\\Lag}{\\partial x_1}.
 \\label{eq:ferko-scalar-flow}
\\end{equation}
For eq.~\\eqref{eq:pure-scalar-L}, $\\partial\\Lag/\\partial x_1=-1/\\Delta_\\phi$, and the right-hand side of eq.~\\eqref{eq:ferko-scalar-flow} is exactly eq.~\\eqref{eq:pure-scalar-Q}.'''
          if old not in s: raise SystemExit('English scalar paragraph not found')
          s=s.replace(old,new,1)
          old='''The same relation also makes the algebraic representation of the flow operator non-unique: any multiple of the difference between the two sides of eq.~\\eqref{eq:algebraic-relation} may be added to a stress-tensor expression without changing its value on DBI configurations.'''
          if old not in s: raise SystemExit('English nonuniqueness sentence not found')
          s=s.replace(old,old+''' Consequently, two apparently different stress-tensor expressions need only agree after restriction to the DBI stress-tensor locus; this is relevant, for example, when comparing the pure-scalar limit with root-type representations in the literature.''',1)
          p.write_text(s,encoding='utf-8')

          p=Path('paper/paper_ja.tex')
          s=p.read_text(encoding='utf-8')
          s=s.replace('独立な test data に対しても小さい誤差で $Q_\\lambda$ を予測できたことから、','独立な test data に対して relative $L^2$ error $1.37\\times10^{-2}$ で $Q_\\lambda$ を予測できたことから、',1)
          old='''以下の導出ではまず $r\\neq0$ かつ $\\Delta\\neq0$ として $h_{\\mu\\nu}$ と DBI matrix の逆行列を用いる。$\\lambda=0$ から連続な nonsingular real branch をこの parametrization で追う限り $r>0$ である。実際 $r$ は $1$ から始まり、符号を変えるには $h$ が特異になる $r=0$ を通らなければならない。以下で得られる最終的な因数分解は original DBI variables に戻せば多項式恒等式として書けるため、恒等式自体は適切な limiting locus へ代数的に延長できる。ただし、この formal continuation と $r=0$ を physical な $h$-invertible branch に含めることは区別する。さらに'''
          new='''以下の導出ではまず $r\\neq0$ かつ $\\Delta\\neq0$ として $h_{\\mu\\nu}$ と DBI matrix の逆行列を用いる。$\\lambda>0$ の nonsingular real branch では $r>0$ である。連続性だけに頼らず確認すると、もし $r<0$ なら $v_\\mu$ は timelike で、rank-one update 後の $h_{\\mu\\nu}$ は positive definite になる。このとき実 $h$-antisymmetric matrix $J$ の eigenvalues は純虚数の conjugate pairs となるため $\\det(\\Id+J)>0$ である。一方、式\\eqref{eq:Delta-J-app}は $\\Delta^2=r\\det(\\Id+J)<0$ を与え、real DBI branch と矛盾する。従って $r<0$ は除外される。以下で得られる最終的な因数分解は original DBI variables に戻せば多項式恒等式として書けるため、恒等式自体は適切な limiting locus へ代数的に延長できる。ただし、この formal continuation と $r=0$ を physical な $h$-invertible branch に含めることは区別する。さらに'''
          if old not in s: raise SystemExit('Japanese r-domain paragraph not found')
          s=s.replace(old,new,1)
          old='''Ferko ら\\cite{Ferko2024DBI} の規約 $x_1=X/2$ では、既知の scalar DBI stress-tensor flow は scalar ansatz 上で
\\begin{equation}
 \\frac{\\partial\\Lag}{\\partial\\lambda}
 =-\\frac12\\Lag^2+\\Lag x_1\\frac{\\partial\\Lag}{\\partial x_1}
 \\label{eq:ferko-scalar-flow}
\\end{equation}
へ簡約される。'''
          new='''Ferko ら\\cite{Ferko2024DBI} の規約では $x_1=X/2$ である。$d=4$ における scalar stress-tensor operator 自体は
\\begin{equation}
 \\mathcal O^{(4)}
 =\\frac18T_{\\mu\\nu}T^{\\mu\\nu}-\\frac1{16}(\\tr T)^2
 +\\frac18(\\tr T)R,
 \\qquad
 R=\\sqrt{\\frac13\\left[T_{\\mu\\nu}T^{\\mu\\nu}-\\frac14(\\tr T)^2\\right]}
 \\label{eq:ferko-scalar-operator}
\\end{equation}
であり、timelike scalar branch では $R=x_1\\partial\\Lag/\\partial x_1$ となる root を選ぶ。scalar ansatz 上では
\\begin{equation}
 \\frac{\\partial\\Lag}{\\partial\\lambda}
 =-\\frac12\\Lag^2+\\Lag x_1\\frac{\\partial\\Lag}{\\partial x_1}
 \\label{eq:ferko-scalar-flow}
\\end{equation}
へ簡約される。'''
          if old not in s: raise SystemExit('Japanese scalar paragraph not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('notes/calculation_note_ja.tex')
          s=p.read_text(encoding='utf-8')
          old='''以下ではまず $r\\neq0$ かつ $\\Delta\\neq0$ として $H^{-1}$ と DBI matrix の逆行列を用いる。$\\lambda=0$ から連続な nonsingular real branch をこの parametrization で追う限り、$r$ は $1$ から始まり $r=0$ の $H$-singularity を横切れないため $r>0$ である。最後に得られる characteristic polynomial の因数分解は original DBI variables に戻すと多項式恒等式として書けるので、恒等式自体は適切な limiting locus へ代数的に延長できる。ただし、この formal continuation と $r=0$ を physical な $H$-invertible branch の点として扱うことは区別する。$R^2=(r-1)R$ なので、直接掛け算すれば'''
          new='''以下ではまず $r\\neq0$ かつ $\\Delta\\neq0$ として $H^{-1}$ と DBI matrix の逆行列を用いる。$\\lambda>0$ の nonsingular real branch では $r>0$ である。もし $r<0$ なら $v_\\mu$ は timelike で $h_{\\mu\\nu}$ は positive definite になるため、実 $h$-antisymmetric matrix $J$ は純虚数の conjugate-pair eigenvalues を持ち $\\det(\\Id+J)>0$ となる。しかし $\\Delta^2=r\\det(\\Id+J)$ なので $\\Delta^2<0$ となり real DBI branch と矛盾する。従って $r<0$ は除外される。最後に得られる characteristic polynomial の因数分解は original DBI variables に戻すと多項式恒等式として書けるので、恒等式自体は適切な limiting locus へ代数的に延長できる。ただし、この formal continuation と $r=0$ を physical な $H$-invertible branch の点として扱うことは区別する。$R^2=(r-1)R$ なので、直接掛け算すれば'''
          if old not in s: raise SystemExit('Note r-domain paragraph not found')
          s=s.replace(old,new,1)
          old='''彼らの stress-tensor operator は scalar ansatz 上で
\\begin{equation}
 \\partial_\\lambda\\Lag=-\\frac12\\Lag^2+\\Lag x_1\\partial_{x_1}\\Lag
 \\label{eq:Ferko-scalar-note}
\\end{equation}
へ簡約される。'''
          new='''$d=4$ では彼らの stress-tensor operator は
\\begin{equation}
 \\mathcal O^{(4)}
 =\\frac18T_{\\mu\\nu}T^{\\mu\\nu}-\\frac1{16}(\\tr T)^2
 +\\frac18(\\tr T)R,
 \\qquad
 R=\\sqrt{\\frac13\\left[T_{\\mu\\nu}T^{\\mu\\nu}-\\frac14(\\tr T)^2\\right]}
 \\label{eq:Ferko-scalar-operator-note}
\\end{equation}
であり、timelike branch では $R=x_1\\partial_{x_1}\\Lag$ を選ぶ。scalar ansatz 上では
\\begin{equation}
 \\partial_\\lambda\\Lag=-\\frac12\\Lag^2+\\Lag x_1\\partial_{x_1}\\Lag
 \\label{eq:Ferko-scalar-note}
\\end{equation}
へ簡約される。'''
          if old not in s: raise SystemExit('Note scalar paragraph not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Compile English manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/paper.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian
      - name: Compile Japanese manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/paper_ja.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian
      - name: Compile calculation note
        uses: xu-cheng/latex-action@v4
        with:
          root_file: notes/calculation_note_ja.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian
      - name: Commit final referee-response edits
        shell: bash
        run: |
          rm -f .github/workflows/referee-finish.yml
          git config user.name "Ryosuke Suda"
          git config user.email "84566919+ryos-physrockme@users.noreply.github.com"
          git add paper/paper.tex paper/paper.pdf paper/paper_ja.tex paper/paper_ja.pdf notes/calculation_note_ja.tex notes/calculation_note_ja.pdf
          git add -u .github/workflows/referee-finish.yml
          git commit -m "Complete pre-arXiv referee revisions"
          git push
