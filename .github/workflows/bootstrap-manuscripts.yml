name: Bootstrap manuscript files

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Restore manuscript sources
        shell: bash
        run: |
          mkdir -p paper notes
          base64 -d .github/bootstrap/paper_en.tex.gz.b64 | gzip -d > paper/paper_en.tex
          base64 -d .github/bootstrap/paper_ja.tex.gz.b64 | gzip -d > paper/paper_ja.tex
          base64 -d .github/bootstrap/calculation_note_ja.tex.gz.b64 | gzip -d > notes/calculation_note_ja.tex

      - name: Compile manuscripts with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/paper_en.tex
            paper/paper_ja.tex
            notes/calculation_note_ja.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian

      - name: Commit sources and PDFs
        shell: bash
        run: |
          rm -rf .github/bootstrap
          rm -f .github/workflows/bootstrap-manuscripts.yml
          rm -f .bootstrap-manuscripts-trigger
          git config user.name "Ryosuke Suda"
          git config user.email "84566919+ryos-physrockme@users.noreply.github.com"
          git add paper/paper_en.tex paper/paper_en.pdf \
                  paper/paper_ja.tex paper/paper_ja.pdf \
                  notes/calculation_note_ja.tex notes/calculation_note_ja.pdf
          git add -A .github .bootstrap-manuscripts-trigger
          git commit -m "Add manuscript sources and compiled PDFs"
          git push
