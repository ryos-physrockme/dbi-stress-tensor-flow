name: One-shot sync current PDFs

on:
  push:
    paths:
      - .github/workflows/sync-current-pdfs.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile current manuscripts with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/paper.tex
            paper/paper_ja.tex
            notes/calculation_note_ja.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian

      - name: Commit synchronized PDFs
        shell: bash
        run: |
          rm -f .github/workflows/sync-current-pdfs.yml
          git config user.name "Ryosuke Suda"
          git config user.email "84566919+ryos-physrockme@users.noreply.github.com"
          git add paper/paper.pdf paper/paper_ja.pdf notes/calculation_note_ja.pdf
          git add -u .github/workflows/sync-current-pdfs.yml
          git diff --cached --quiet || git commit -m "Synchronize manuscript PDFs with current sources"
          git push
